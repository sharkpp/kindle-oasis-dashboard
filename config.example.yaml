# MyRealDashboard の設定。
# これを config.yaml にコピーして、URL と時間を自分のものに置き換える。
# フィードの URL は URL 自体が認証情報なので、config.yaml は公開しないこと。

timezone: Asia/Tokyo

# クライアントが更新を確認しに来る間隔（秒）。
poll_sec: 10
# 表示内容を作り直す間隔（秒）。内容が変わったときだけ画面を書き換える。
tick_sec: 20

# 画面の外周の余白（px）。数値ひとつなら四辺とも同じ。
# 端末が返すビューポートより実際に見えている範囲が狭いときは、
# 辺ごとに指定してその分を詰める（--markers で確認できる）。
#   padding: { top: 28, right: 28, bottom: 60, left: 28 }
padding: 28

# 項目どうしのすき間（px）。
gap: 18

# 取得元。名前は自由に付けられる。type で種別を選ぶので、同じ種別をいくつでも
# 定義できる（子供が 2 人ならぴよログを 2 つ、カレンダーも家族用と保育園用で分ける）。
# 項目からはこの名前で指す。
sources:
  # ぴよログ データフィード。アプリの設定 → データフィード で発行した URL。
  # 同じ URL への取得は 1 分に 1 回までが目安。取得期間ごとのキャッシュ保持時間
  # （24h: 1 分 / 3d: 2 分 / 7d: 5 分 / 28d: 15 分）以上の間隔を空ける。
  ぴよログ:
    type: piyolog
    url: "https://feed.piyolog.com/v1/feed/24h/FEED_ID/SECRET"
    interval_sec: 300

  # Google カレンダーの「iCal 形式の非公開 URL」。
  # カレンダーの設定 → カレンダーの統合 からコピーする。
  かぞく:
    type: calendar
    url: "https://calendar.google.com/calendar/ical/xxxxxxxx%40group.calendar.google.com/private-yyyyyyyy/basic.ics"
    interval_sec: 600

  ほいくえん:
    type: calendar
    url: "https://calendar.google.com/calendar/ical/zzzzzzzz%40group.calendar.google.com/private-wwwwwwww/basic.ics"
    interval_sec: 600

  # 気象庁の防災情報 JSON。認証も利用登録もいらない。
  # area は府県予報区のコード（東京都なら 130000）。
  # sub_area / temp_area を省くと、その予報区の最初の区域とアメダス地点を使う。
  てんき:
    type: weather
    area: "130000"
    # sub_area: "130010"   # 東京地方
    # temp_area: "44132"   # 東京（気温を取るアメダス地点）
    interval_sec: 1800

# 画面はカラムに横分割し、各カラムの中で項目を縦に積む。
# width と height は比率。端末の画素数に合わせて引き伸ばされる。
columns:
  - width: 1
    items:
      - type: clock
        height: 3
        date: true

      - type: section
        height: 0.8
        text: ごはん

      - type: countdown
        height: 3
        times:
          - { at: "07:30", name: あさごはん }
          - { at: "12:00", name: おひるごはん }
          - { at: "15:00", name: おやつ }
          - { at: "18:00", name: ばんごはん }
          # 曜日を書くと、その曜日だけ有効になる。書かなければ毎日。
          - { at: "10:00", name: ほいくえんのおやつ, days: [mon, tue, wed, thu, fri] }

      - type: section
        height: 0.8
        text: ミルク

      - type: milk
        height: 3
        # どのぴよログを見るか。省略すれば最初に定義したもの。
        source: ぴよログ
        # 前回の記録から何分後を目標にするか。
        interval_min: 180
        # 対象にするぴよログの記録種別。Formula=ミルク, BreastFeeding=母乳。
        record_types: [Formula, BreastFeeding]

      # きょうの回数と量の合計。日の境目は timezone の 0 時。
      - type: milk-total
        height: 2
        label: きょうのごうけい
        source: ぴよログ
        record_types: [Formula]

  - width: 1
    items:
      - type: section
        height: 0.8
        text: きょうのよてい

      - type: calendar
        height: 6
        count: 5
        # どのカレンダーを見るか。省略すれば最初に定義したもの。
        sources: [かぞく, ほいくえん]
        # 件名の絞り込み。/.../ で囲めば正規表現、そうでなければワイルドカード。
        # match: "*クリニック*"
        # match: "/^(えんそく|けんしん)/"
        # 見せ方を直近から順に当てる。予定は日でまとめるので、同じ日の予定は
        # まとめて同じ段階になる（明日と明後日の予定があれば、明日の分だけが最初の段階）。
        # 段階が尽きた分は最後の段階を使う。省略すれば枠に収まる大きさを自動で決める。
        # font_scale は項目の高さに対する割合、font_size は px。
        levels:
          - font_scale: 0.065  # 直近の日
          - font_scale: 0.05   # その次の日
          - font_scale: 0.038  # それ以降

      - type: section
        height: 0.8
        text: よる

      - type: countdown
        height: 2.5
        label: おふろ
        # 項目に days を書くと、その項目の時刻すべての既定になる。
        days: [sun, mon, tue, wed, thu, fri, sat]
        times: ["19:00"]

      - type: countdown
        height: 2.5
        label: ねるじかん
        times: ["20:30"]
